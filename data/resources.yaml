# Featured releases — shown prominently on the page
featured:
  - name: "CLLG Freed Corpus"
    description: "A corpus compiled from the TLG's CD-ROM E, with citeStructure and TEI encoding reworked to better align with the logical architecture of the texts. Page and line breaks of the printed volumes are encoded with pb and lb."
    url: "https://freed-corpus-bae861.gitlabpages.inria.fr/"
    badge: "GitLab Pages"
    icon: "gitlab"

  - name: "CLLG Sources Chrétiennes"
    description: "The Greek corpus of the Sources Chrétiennes collection, in XML-TEI with canonical citation structures. Irenaeus is excluded: its mix of retroversions and fragments is not in the public domain under French law."
    url: "https://sources-chretiennes-bd2dfb.gitlabpages.inria.fr/"
    badge: "GitLab Pages"
    icon: "gitlab"

  - name: "CLLG Nova"
    description: "A corpus of XML-TEI texts produced within the CLLG project. Currently under development and expanded over time."
    url: "https://cllg-nova-aa7b0d.gitlabpages.inria.fr/index.html"
    badge: "GitLab Pages"
    icon: "gitlab"

  - name: "Polytonic Greek HTR Model"
    description: "A Kraken/eScriptorium recognition model for diachronic polytonic Greek, with very high character-level accuracy, including on printed material with ligatures. Also available on the Inria eScriptorium instance."
    url: "https://htrmopo.inria.fr/models/10.5281-zenodo.21295924/cllg-polytonic-greek-model-recognition"
    badge: "HTRMoPo"
    icon: "model"

  - name: "Ancient Greek Printed Edition Segmentation Model"
    description: "A Kraken segmentation model for printed editions of ancient Greek. It requires an upcoming Kraken fix, so it cannot yet be used in eScriptorium."
    url: "https://htrmopo.inria.fr/models/10.5281-zenodo.24077352/cllg-ancient-greek-printed-edition-segmentation"
    badge: "HTRMoPo"
    icon: "model"

  - name: "CLLG-Scanner"
    description: "A local desktop app that converts scanned Ancient Greek and Latin editions (PDF, DjVu, images, ALTO) into structured TEI XML, using Kraken OCR. Nothing leaves your machine. Apache-2.0."
    url: "https://github.com/cllg-project/cllg-scanner"
    demo: "https://cllg-project.github.io/cllg-scanner/"
    badge: "GitHub"
    icon: "github"

  - name: "Ancient Greek Printed Dataset"
    description: "Seven Ancient Greek printed documents (17th-21st century) with manually transcribed lines: 60 files, 2,113 lines and 69,351 characters. CC-BY 4.0."
    url: "https://zenodo.org/records/22098097"
    badge: "Zenodo"
    icon: "zenodo"

# HuggingFace resources
huggingface:
  org_url: "https://huggingface.co/CLLG"
  models:
    label: "Models on HuggingFace"
    url: "https://huggingface.co/CLLG/models"
    description: "OCR and layout analysis models for ancient Greek and Latin texts."
  datasets:
    label: "Datasets on HuggingFace"
    url: "https://huggingface.co/CLLG/datasets"
    description: "Synthetic training dataset of ~185,000 pages generated from TEI/XML sources across 4,582 works with over 5,000 style combinations, plus real-world benchmarks of scanned critical editions."

# Code repositories
repositories:
  - name: "CLLG on GitHub"
    url: "https://github.com/CLLG"
    description: "Source code, tools, and supporting repositories."
    icon: "github"
  - name: "CLLG on GitLab (Inria)"
    url: "https://gitlab.inria.fr/almanach/cllg"
    description: "Primary source code and corpus data hosted at Inria."
    icon: "gitlab"

# Software tools, grouped by purpose
software:
  - group: "Recognition & Layout"
    items:
      - name: "Kraken-JS"
        url: "https://github.com/cllg-project/kraken-js"
        description: "A partial port of Kraken inference to JavaScript, running Kraken OCR/HTR models on Node.js and Electron without requiring Python at inference time. Includes segmentation, recognition, and a full end-to-end pipeline with WebGPU/CUDA support. Apache-2.0."
        icon: "github"

  - group: "Text Processing & Encoding"
    items:
      - name: "Light Tagger"
        url: "https://github.com/cllg-project/light-tagger"
        description: "A light tagger finding notes, bibliographic citations and references (section, chapter, page, column, line locators) in running Greek and Latin text. A pair of linear-chain CRFs whose exact same model runs in Python and in pure JavaScript, with no native code or dependencies."
        icon: "github"
      - name: "HookTest"
        url: "https://github.com/cllg-project/hooktest"
        description: "Validation tool for TEI XML files with CiteStructure encoding and DTS catalog registries. Allows automated testing and reference retrieval without human intervention."
        icon: "github"

  - group: "Publication & Access"
    items:
      - name: "MyDapytains"
        url: "https://github.com/distributed-text-services/MyDapytains"
        description: "A ready-to-deploy DTS (Distributed Text Services) API server built on TEI structure, enabling standard programmatic access to corpus texts."
        icon: "github"
